name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b ~/.local/bin
          echo ~/.local/bin >>"$GITHUB_PATH"
      - run: shellcheck install.sh apply.sh home/dot_local/bin/executable_dotfiles-sync tests/*.sh
      - run: for t in tests/*_test.sh; do sh "$t"; done
  install:
    runs-on: ubuntu-latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      DOTFILES_RUNNER: '0'
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh
      - name: re-run moves nothing aside
        run: |
          backups() { find ~/.local/state/dotfiles/backup -mindepth 1 -maxdepth 1 2>/dev/null | wc -l; }
          before=$(backups)
          ./install.sh
          test "$(backups)" = "$before"
      - run: |
          cmp ~/.zshrc home/dot_zshrc
          test "$(~/.local/bin/chezmoi source-path)" = "$PWD/home"
          test "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$(command -v zsh)"
          ~/.local/bin/mise --version
          ~/.local/bin/oh-my-posh --version
          systemctl --user is-enabled dotfiles-sync.timer
