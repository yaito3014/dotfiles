name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b ~/.local/bin
          echo ~/.local/bin >>"$GITHUB_PATH"
      - run: shellcheck install.sh apply.sh home/dot_local/bin/executable_dotfiles-sync tests/*.sh
      - run: for t in tests/*_test.sh; do sh "$t"; done
  install:
    runs-on: ubuntu-latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      DOTFILES_RUNNER: '0'
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh
      - name: re-run moves nothing aside
        run: |
          backups() { find ~/.local/state/dotfiles/backup -mindepth 1 -maxdepth 1 2>/dev/null | wc -l; }
          before=$(backups)
          ./install.sh
          test "$(backups)" = "$before"
      - run: |
          cmp ~/.zshrc home/dot_zshrc
          test "$(~/.local/bin/chezmoi source-path)" = "$PWD/home"
          test "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$(command -v zsh)"
          ~/.local/bin/mise --version
          ~/.local/bin/oh-my-posh --version
          systemctl --user is-enabled dotfiles-sync.timer
  windows:
    runs-on: windows-latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      DOTFILES_RUNNER: '0'
    steps:
      - uses: actions/checkout@v7
      # Windows PowerShell, which every machine has, rather than pwsh.
      - run: ./install.ps1
        shell: powershell
      - name: re-run moves nothing aside
        shell: powershell
        run: |
          $Backup = Join-Path $HOME '.local\state\dotfiles\backup'
          function Get-BackupCount { @(Get-ChildItem $Backup -ErrorAction SilentlyContinue).Count }
          $Before = Get-BackupCount
          ./install.ps1
          if ((Get-BackupCount) -ne $Before) { throw 'the re-run moved files aside' }
      - shell: powershell
        run: |
          # Steps do not see PATH changes made by earlier ones.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          git diff --no-index --quiet (Join-Path $HOME '.claude\CLAUDE.md') home/dot_claude/CLAUDE.md
          if ($LASTEXITCODE -ne 0) { throw '~/.claude/CLAUDE.md is not applied' }
          if (Test-Path (Join-Path $HOME '.zshrc')) { throw '~/.zshrc was applied on Windows' }
          $ProfileHook = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'WindowsPowerShell\profile.ps1'
          if (-not (Select-String -Quiet -SimpleMatch 'powershell\profile.ps1' $ProfileHook)) { throw 'the profile hook is missing' }
          Get-ScheduledTask -TaskName dotfiles-sync | Out-Null
          chezmoi --version
          oh-my-posh --version
          mise --version
          jq --version
      - name: unit tests under Git Bash
        shell: bash
        run: for t in tests/*_test.sh; do sh "$t"; done
